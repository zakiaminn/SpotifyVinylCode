; Board: ESP32-WROOM-32 dev board (CP2102 USB), detected as /dev/cu.usbserial-0001
; Two build targets:
;   esp32dev  -> the real firmware (src/main.cpp): WiFi portal + Spotify
;   paneltest -> src/panel_test.cpp: lights the LED panel to prove the wiring
; Flash a target with:  ~/.platformio/penv/bin/pio run -e <target> -t upload

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

[env:esp32dev]
build_src_filter = -<*> +<main.cpp> +<vinyl.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.1.0
    adafruit/Adafruit GFX Library
    bodmer/TJpg_Decoder@^1.1.0

[env:paneltest]
build_src_filter = -<*> +<panel_test.cpp>
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.1.0
    adafruit/Adafruit GFX Library
